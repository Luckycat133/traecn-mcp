name: macOS release candidate verification (no publish)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-launch-v0.7.1.yml'
      - 'package*.json'
      - 'Formula/**'
      - 'distribution/homebrew/**'
      - 'CHANGELOG.md'
      - 'docs/RELEASE-MILESTONES.md'
      - 'mcp-server*.js'
      - 'scripts/**'
      - 'src/**'
      - 'skills/**'
      - 'integrations/**'
      - 'server.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Confirm clean candidate and native platform
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          test "$(node -p process.platform)" = darwin
      - run: node scripts/release-launch-v071.test.js
      - run: npm ci
      - run: npm run test:release

      - name: Validate and install the Homebrew candidate (local archive only)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: bash scripts/check-homebrew-candidate.sh
