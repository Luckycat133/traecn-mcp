name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: lint-and-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify distribution versions
        run: npm run check:versions

      - name: Syntax lint (node --check)
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: CLI tests
        run: npm run test:cli

      - name: Package portable Skill
        run: npm run pack:skill

      - name: Audit prod dependencies
        run: npm run audit:prod || true