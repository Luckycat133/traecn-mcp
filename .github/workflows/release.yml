name: Release verification

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (for example v0.5.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify the tag is the checked-out commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; fi
          test -z "$(git status --porcelain)"

      - run: npm ci
      - run: npm run test:release

      - name: Verify release version and manifest provenance
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "${RELEASE_TAG#v}" = "$(node -p "require('./package.json').version")"
          npm run verify:release-manifest

      - name: Create or update the GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Published assets are immutable."
            exit 1
          fi
          mapfile -t ARTIFACTS < <(node -e "const m=require('./dist/traecn-mcp-release.json'); console.log(m.artifacts.map(a=>a.path).concat(m.serverPackage.artifact.path, 'dist/traecn-mcp-release.json').join('\\n'))")
          gh release create "$RELEASE_TAG" "${ARTIFACTS[@]}" --verify-tag --title "TraeCN MCP $RELEASE_TAG" --generate-notes
